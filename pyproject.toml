[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pyprttl"
version = "1.0.1"
description = "Python bindings for the prttl Turtle formatter"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Andrew Hankinson", email = "andrew.hankinson@gmail.com" },
]
keywords = ["rdf", "turtle", "formatter", "pretty-printer", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/rism-digital/pyprttl"
Repository = "https://github.com/rism-digital/pyprttl"
Issues = "https://github.com/rism-digital/pyprttl/issues"
Upstream = "https://codeberg.org/elevont/prttl"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "pyprttl.pyprttl"

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "pytest>=8.4.2",
]
